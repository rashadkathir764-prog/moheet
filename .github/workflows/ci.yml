name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moheet_ci
          POSTGRES_USER: moheet_ci
          POSTGRES_PASSWORD: moheet_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moheet_ci -d moheet_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      API_PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: moheet_ci
      DB_USER: moheet_ci
      DB_PASSWORD: moheet_ci_password
      DB_LOGGING: false
      DB_SYNCHRONIZE: false
      DB_MIGRATIONS_RUN: false
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret-ci-access-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret-ci-refresh
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --no-fix
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run migration:run
      - run: npm run test:e2e -- --runInBand

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
